name: Solid (Solid.fi)
kind: company
description: >-
  Solid (formerly Wise) was a venture-backed fintech-as-a-service / embedded
  finance platform offering banking, card, and payment APIs to fintech
  builders. Solid raised more than $80M, including a 2022 Series B led by
  FTV Capital. The company subsequently became the subject of significant
  legal trouble - including litigation with FTV Capital and reported
  customer disputes - and substantially wound down operations through
  2023-2024. As of this profile, the solidfi.com site is not responding to
  requests and no active API or onboarding pipeline appears to be operating.
  This is an honest historical record; treat any API references as
  unverified / inactive.
